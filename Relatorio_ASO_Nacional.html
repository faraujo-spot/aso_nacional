<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASO | Nacional</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#eef0f3;color:#1a2340;font-size:13px}
.hdr{background:#1a2c52;padding:14px 26px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.hdr-top{display:flex;align-items:center;justify-content:space-between}
.hdr-title{color:#fff;font-size:19px;font-weight:700}
.hdr-sub{color:#8fa4c8;font-size:11px;margin-top:2px}
.page{padding:14px 22px 48px}

.cards-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px}
.card{background:#fff;border-radius:8px;padding:11px 12px 9px;border:1px solid #e4e9f2}
.card-lbl{font-size:9px;font-weight:700;color:#7a8aaa;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.card-accent{height:2px;width:20px;border-radius:2px;margin-bottom:6px}
.card-num{font-size:24px;font-weight:700;line-height:1}
.acc-dk{background:#1a2c52}.acc-rd{background:#a82828}.acc-or{background:#b86e0a}.acc-gr{background:#1e6b3a}

.filt-box{background:#fff;border:1px solid #dce3ef;border-radius:8px;padding:10px 14px;margin-bottom:12px}
.filt-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.fg{display:flex;flex-direction:column;gap:3px}
.fg label{font-size:9px;font-weight:700;color:#5a6a8a;text-transform:uppercase;letter-spacing:.5px}
.fg select,.fg input{background:#fff;border:1px solid #dce3ef;border-radius:5px;color:#1a2340;padding:5px 7px;font-size:11px;font-family:'Inter',sans-serif;outline:none;min-width:150px}
.fg select:focus,.fg input:focus{border-color:#1a2c52}
.btn-clear{background:none;border:1px solid #dce3ef;color:#5a6a8a;padding:6px 11px;border-radius:5px;font-size:11px;cursor:pointer;font-family:'Inter',sans-serif}
.btn-clear:hover{border-color:#1a2c52;color:#1a2c52}

.tbl-controls{display:flex;gap:7px;align-items:center;margin-bottom:7px;flex-wrap:wrap}
.cnt-badge{margin-left:auto;font-size:9px;color:#7a8aaa;background:#fff;border:1px solid #dce3ef;border-radius:20px;padding:2px 8px}
.tbl-wrap{background:#fff;border:1px solid #e4e9f2;border-radius:8px;overflow:auto;max-height:70vh}

table{width:100%;border-collapse:collapse;font-size:11px}
thead{position:sticky;top:0;z-index:2}
th{background:#f6f8fc;color:#5a6a8a;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:6px;border-bottom:1px solid #e4e9f2;white-space:nowrap;text-align:left}
td{padding:5px 6px;border-bottom:1px solid #f0f2f5;white-space:nowrap;color:#1a2340;font-size:11px}
tr:hover td{background:#f8fafd}
tr:last-child td{border-bottom:none}

.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.b-vencido{background:#fdecea;color:#a82828}
.b-a_vencer{background:#fef6e4;color:#7a5000}
.b-em_dia{background:#e8f5ee;color:#1e6b3a}

.btn-marcar{background:#1a2c52;color:#fff;border:none;border-radius:5px;padding:4px 10px;font-size:10px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.btn-marcar:hover{background:#243c6e}
.btn-marcar:disabled{background:#c7cee0;cursor:default}
.marc-row{display:flex;gap:4px;align-items:center}
.marc-row input[type=date]{border:1px solid #dce3ef;border-radius:5px;padding:3px 5px;font-size:10px;font-family:'Inter',sans-serif}
.tag-ok{font-size:10px;color:#1e6b3a;font-weight:700}
.tag-pend{font-size:10px;color:#7a8aaa}

.toast{position:fixed;bottom:18px;right:18px;background:#1a2340;color:#fff;padding:10px 16px;border-radius:8px;font-size:12px;box-shadow:0 6px 18px rgba(0,0,0,.25);display:none;z-index:50;max-width:320px}
.toast.show{display:block}
.toast.err{background:#a82828}
</style>
</head>

  </div>

  <div class="tbl-controls">

  </div>
  <div class="tbl-wrap">
    <table>

        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

      render();
    });
  }

  function filtrar(ignorarCampo){
    var st = document.getElementById("fStatus").value;
    var uf = document.getElementById("fUF").value;
    var emp = document.getElementById("fEmpresa").value;
    var job = document.getElementById("fJob").value;
    var busca = document.getElementById("fBusca").value.trim().toUpperCase();
    return DADOS.filter(function(d){
      if (ignorarCampo !== "Status" && st !== "TODOS" && d.Status !== st) return false;
      if (ignorarCampo !== "UF" && uf !== "TODOS" && d.UF !== uf) return false;
      if (ignorarCampo !== "Empresa" && emp !== "TODOS" && d.Empresa !== emp) return false;
      if (ignorarCampo !== "Job" && job !== "TODOS" && d.Job !== job) return false;
      if (busca && d.Nome.toUpperCase().indexOf(busca) === -1 && String(d.CPF).indexOf(busca) === -1) return false;
      return true;
    });
  }

  function atualizarOpcoesDependentes(){
    Object.keys(CAMPO_POR_ID).forEach(function(id){
      var campo = CAMPO_POR_ID[id];
      var sel = document.getElementById(id);
      var valorAtual = sel.value;
      // opções calculadas ignorando o próprio filtro, mas respeitando os outros já escolhidos
      var subset = filtrar(campo);
      var opcoes = Array.from(new Set(subset.map(function(d){ return d[campo]; }).filter(Boolean))).sort();

      sel.innerHTML = '<option value="TODOS">' + LABEL_VAZIO[id] + '</option>';
      opcoes.forEach(function(v){
        var opt = document.createElement("option");
        opt.value = v; opt.textContent = v;
        sel.appendChild(opt);
      });
      // preserva a seleção atual se ela ainda for válida com os outros filtros ativos;
      // senão volta pra "Todos/Todas" em vez de ficar presa numa combinação impossível
      sel.value = (opcoes.indexOf(valorAtual) > -1) ? valorAtual : "TODOS";
    });
  }

  function atualizarCards(){
    var vencido = DADOS.filter(function(d){ return d.Status === "vencido"; }).length;
    var aVencer = DADOS.filter(function(d){ return d.Status === "a_vencer"; }).length;
    var emDia = DADOS.filter(function(d){ return d.Status === "em_dia"; }).length;
    document.getElementById("cardVencido").textContent = vencido;
    document.getElementById("cardAVencer").textContent = aVencer;
    document.getElementById("cardEmDia").textContent = emDia;
    document.getElementById("cardTotal").textContent = DADOS.length;
  }

  function linhaAcao(d){
    var jaMarcadoAgora = marcadosNestaSessao[d.CPF];
    if (jaMarcadoAgora){
      return '<span class="tag-ok">&#10003; Registrado (' + jaMarcadoAgora + ')</span>';
    }
    return (
      '<div class="marc-row">' +
        '<input type="date" id="data_' + d.CPF + '">' +
        '<button class="btn-marcar" onclick="window.__marcarAso(\'' + d.CPF + '\')">ASO feito</button>' +
      '</div>'
    );
  }

  function render(){
    atualizarOpcoesDependentes();
    var linhas = filtrar();
    var tbody = document.getElementById("tbody");
    tbody.innerHTML = linhas.map(function(d){
      return "<tr>" +
        "<td>" + d.Nome + "</td>" +
        "<td>" + d.CPF + "</td>" +
        "<td>" + (d.UF || "") + "</td>" +
        "<td>" + (d.Cargo || "") + "</td>" +
        "<td>" + (d.Empresa || "") + "</td>" +
        "<td>" + (d.Job || "") + "</td>" +
        "<td>" + d.DiasAcumulados + "</td>" +
        "<td>" + (d.UltimoASORegistrado ? formatarDataBR(d.UltimoASORegistrado) : "—") + "</td>" +
        "<td>" + formatarDataBR(d.Vencimento) + "</td>" +
        '<td><span class="badge b-' + d.Status + '">' + badgeLabel(d.Status) + "</span></td>" +
        "<td>" + linhaAcao(d) + "</td>" +
      "</tr>";
    }).join("");
    document.getElementById("cntBadge").textContent = linhas.length + " registro(s)";
  }

  function marcarAso(cpf){
    var dado = DADOS.filter(function(d){ return String(d.CPF) === String(cpf); })[0];
    if (!dado) return;
    var input = document.getElementById("data_" + cpf);
    var dataExame = input ? input.value : "";
    if (!dataExame){ showToast("Escolha uma data antes de marcar como feito.", true); return; }

    if (!SYNC_URL || SYNC_URL.indexOf("COLE_AQUI") === 0){
      showToast("Sincronização ainda não configurada (SYNC_URL). Avise o responsável pelo painel.", true);
      return;
    }

    var payload = { cpf: String(cpf), nome: dado.Nome, data_exame: dataExame };
    var iframe = document.getElementById("syncFrame");
    var form = document.createElement("form");
    form.method = "POST";
    form.action = SYNC_URL;
    form.target = "syncFrame";
    form.style.display = "none";
    var inputHidden = document.createElement("input");
    inputHidden.type = "hidden";
    inputHidden.name = "payload";
    inputHidden.value = JSON.stringify(payload);
    form.appendChild(inputHidden);
    document.body.appendChild(form);
    form.submit();
    document.body.removeChild(form);

    marcadosNestaSessao[cpf] = dataExame.split("-").reverse().join("/");
    render();
    showToast("ASO de " + dado.Nome + " registrado. O status no painel atualiza no próximo processamento diário.");
  }
  window.__marcarAso = marcarAso;

  function parseCsvGeneric(text){
    // Parser respeitando aspas (campo com vírgula, ex: nome "SOUZA, MARIA", vem entre aspas no
    // CSV publicado pelo Google Sheets) — split(",") ingênuo quebraria o alinhamento das colunas.
    var rows = [];
    var i=0, field="", row=[], inQuotes=false;
    text = (text||"").replace(/\r\n/g,"\n").replace(/^﻿/,"");
    while (i < text.length){
      var c = text[i];
      if (inQuotes){
        if (c === '"'){
          if (text[i+1] === '"'){ field += '"'; i+=2; continue; }
          inQuotes = false; i++; continue;
        }
        field += c; i++; continue;
      } else {
        if (c === '"'){ inQuotes = true; i++; continue; }
        if (c === ','){ row.push(field); field=""; i++; continue; }
        if (c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; i++; continue; }
        field += c; i++; continue;
      }
    }
    if (field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(function(r){ return r.length>1 || (r[0]||"").trim().length; });
  }

  function carregarRegistrosExistentes(){
    if (!REGISTROS_CSV_URL || REGISTROS_CSV_URL.indexOf("COLE_AQUI") === 0) return;
    fetch(REGISTROS_CSV_URL + (REGISTROS_CSV_URL.indexOf("?") > -1 ? "&" : "?") + "_=" + Date.now(), {cache:"no-store"})
      .then(function(r){ return r.text(); })
      .then(function(text){
        var linhas = parseCsvGeneric(text);
        if (linhas.length < 2) return;
        var header = linhas[0].map(function(h){ return h.trim().toUpperCase(); });
        var iCpf = header.indexOf("CPF");
        var iData = header.indexOf("DATA_EXAME");
        if (iCpf === -1 || iData === -1) return;
        for (var i=1; i<linhas.length; i++){
          var cpf = (linhas[i][iCpf] || "").replace(/[^0-9]/g,"");
          var data = (linhas[i][iData] || "").trim();
          if (cpf && data) marcadosNestaSessao[cpf] = data;
        }
        render();
      })
      .catch(function(){ /* silencioso — painel continua funcionando com o snapshot local */ });
  }

  atualizarCards();
  initFiltros();
  render();
  carregarRegistrosExistentes();
})();
</script>
